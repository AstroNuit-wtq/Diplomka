plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diplomka.nativeapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.diplomka.nativeapp'
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "2.7.5-motor-ui"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -frtti -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'arm64-v8a'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // Native-only application; no Java/Kotlin UI dependencies required.
}
