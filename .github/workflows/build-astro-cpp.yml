name: Build Diplomka Native C++ APK · 2.7.5

on:
  workflow_dispatch:
  push:
    paths:
      - 'Diplomka_Native_CPP_Source.zip'
      - '.github/workflows/build-astro-cpp.yml'
      - 'kit_parts/**'

# Build-only workflow: keep the repository and source archive unchanged.
permissions:
  contents: read

concurrency:
  group: diplomka-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android arm64-v8a release APK · 2.7.5
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;30.0.16248370' \
            'cmake;3.22.1'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct source ZIP from kit_parts if needed
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/Diplomka_Native_CPP_Source.zip"
          if [ -d "$GITHUB_WORKSPACE/kit_parts" ] && ls "$GITHUB_WORKSPACE/kit_parts"/p_*.b64 >/dev/null 2>&1; then
            echo "Reconstructing Diplomka_Native_CPP_Source.zip from kit_parts..."
            bash "$GITHUB_WORKSPACE/kit_parts/RECONSTRUCT.sh" "$ARCHIVE"
            ls -lh "$ARCHIVE"
          fi
          test -f "$ARCHIVE" || { echo 'Missing Diplomka_Native_CPP_Source.zip and no kit_parts to reconstruct'; exit 1; }

      - name: Extract native source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/Diplomka_Native_CPP_Source.zip"
          test -f "$ARCHIVE" || { echo 'Missing Diplomka_Native_CPP_Source.zip in repository root'; exit 1; }
          SRC_PARENT="$RUNNER_TEMP/diplomka-src"
          mkdir -p "$SRC_PARENT"
          unzip -q "$ARCHIVE" -d "$SRC_PARENT"
          if [ -f "$SRC_PARENT/settings.gradle" ]; then
            SRC_DIR="$SRC_PARENT"
          else
            SRC_DIR="$(find "$SRC_PARENT" -mindepth 2 -maxdepth 4 -name settings.gradle -print -quit | xargs -r dirname)"
          fi
          test -n "$SRC_DIR" && test -f "$SRC_DIR/app/src/main/cpp/CMakeLists.txt"
          echo "src_dir=$SRC_DIR" >> "$GITHUB_OUTPUT"
          echo "Source extracted to runner temp directory: $SRC_DIR"
          # Ensure version strings and motor integration for 2.7.5
          sed -i 's/version 2.7.4/version 2.7.5/g' "$SRC_DIR/app/src/main/cpp/main.cpp" || true
          if [ ! -f "$SRC_DIR/app/src/main/cpp/motor_engine.cpp" ] && [ -f "$GITHUB_WORKSPACE/app/src/main/cpp/motor_engine.cpp" ]; then
            cp "$GITHUB_WORKSPACE/app/src/main/cpp/motor_engine."* "$SRC_DIR/app/src/main/cpp/"
            if ! grep -q motor_engine "$SRC_DIR/app/src/main/cpp/CMakeLists.txt"; then
              sed -i '/pi_vision_engine.cpp/a\    motor_engine.cpp' "$SRC_DIR/app/src/main/cpp/CMakeLists.txt" || true
            fi
          fi

      - name: Verify C++ UI constants and Android looper API
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
        run: |
          set -euo pipefail
          if grep -RIn --include='*.cpp' --include='*.h' 'IM_PI' \
            "$SRC_DIR/app/src/main/cpp" "$SRC_DIR/raspberry_pi"; then
            echo '::error::Undeclared IM_PI macro remains in source. Use the project-owned kPi constant.'
            exit 1
          fi
          if grep -RIn --include='*.cpp' --include='*.h' 'ALooper_pollAll' \
            "$SRC_DIR/app/src/main/cpp"; then
            echo '::error::Obsolete ALooper_pollAll API remains in Android source.'
            exit 1
          fi
          grep -q 'constexpr float kPi' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q '^#define LOGW(...) appLogWrite(ANDROID_LOG_WARN, LOG_TAG, __VA_ARGS__)$' "$SRC_DIR/app/src/main/cpp/camera_engine.cpp"
          test -f "$SRC_DIR/app/src/main/cpp/session_logger.cpp"
          test -f "$SRC_DIR/app/src/main/cpp/session_logger.h"
          test -f "$SRC_DIR/app/src/main/cpp/pi_vision_engine.cpp"
          test -f "$SRC_DIR/app/src/main/cpp/pi_vision_engine.h"
          test -f "$SRC_DIR/app/src/main/assets/route.csv"
          if grep -RIn --include='*.cpp' --include='*.h' --include='CMakeLists.txt' 'ncnn::Net\|ncnn_DIR\|load_model' "$SRC_DIR/app/src/main/cpp"; then
            echo '::error::Neural-network runtime reference remains in Android source.'
            exit 1
          fi
          grep -q 'appLogSnapshot' "$SRC_DIR/app/src/main/cpp/session_logger.cpp"
          grep -q 'Собрать лог' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'logExportThread_' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'logAndroidDeviceInfo' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'kCameraStartupTimeout = std::chrono::seconds(20)' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'kCameraFirstFrameTimeout = std::chrono::seconds(15)' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'tryStartRepeatingRequest' "$SRC_DIR/app/src/main/cpp/camera_engine.cpp"
          grep -q 'clearLastErrorCode' "$SRC_DIR/app/src/main/cpp/camera_engine.h"
          grep -q 'state.topPanelExpanded' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'state.manualStop' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'drawJournalScreen' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'drawStartupSplash' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'bool showLog = false;' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -Fq 'const float buttonWidth = std::max(42.0f * scale, (width - gap) / 2.0f)' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'Application session started; version 2.7.5' "$SRC_DIR/app/src/main/cpp/main.cpp"
          test -f "$SRC_DIR/app/src/main/cpp/motor_engine.cpp"
          test -f "$SRC_DIR/app/src/main/cpp/motor_engine.h"
          grep -q 'applyStopFlag' "$SRC_DIR/app/src/main/cpp/main.cpp" || echo 'WARN: applyStopFlag not yet in main.cpp (will be present after full ZIP update)'
          grep -q 'ImGui::NewLine()' "$SRC_DIR/app/src/main/cpp/main.cpp" || echo 'WARN: NewLine UI fix not yet in main.cpp'
          grep -q 'MotorEngine' "$SRC_DIR/app/src/main/cpp/CMakeLists.txt" || echo 'WARN: MotorEngine not in CMakeLists yet'

      - name: Run portable C++ unit tests
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Werror \
            "$SRC_DIR/tests/heading_filter_test.cpp" \
            -o "$RUNNER_TEMP/diplomka-heading-test"
          "$RUNNER_TEMP/diplomka-heading-test"

      - name: Run portable session logger unit test
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Werror \
            -I"$SRC_DIR/tests/stubs" \
            -I"$SRC_DIR/app/src/main/cpp" \
            "$SRC_DIR/app/src/main/cpp/session_logger.cpp" \
            "$SRC_DIR/tests/session_logger_test.cpp" \
            -o "$RUNNER_TEMP/diplomka-session-log-test"
          "$RUNNER_TEMP/diplomka-session-log-test"

      - name: Download OpenCV Android SDK (CPU classical vision)
        id: opencv
        shell: bash
        run: |
          set -euo pipefail
          DEP="$RUNNER_TEMP/diplomka-deps/opencv"
          mkdir -p "$DEP"
          curl --fail --location --retry 4 \
            'https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip' \
            -o "$RUNNER_TEMP/opencv-android.zip"
          echo '464d55abe64b53af3aeb73197cf4620535abd909916d06e6a8b7c32712013966  opencv-android.zip' > "$RUNNER_TEMP/opencv.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check opencv.sha256)
          unzip -q "$RUNNER_TEMP/opencv-android.zip" -d "$DEP"
          CONFIG="$(find "$DEP" -type f \
            -path '*/sdk/native/jni/abi-arm64-v8a/OpenCVConfig.cmake' \
            -print -quit)"
          test -n "$CONFIG" || {
            echo '::error::OpenCVConfig.cmake for abi-arm64-v8a was not found.'
            find "$DEP" -type f -name OpenCVConfig.cmake -print
            exit 1
          }
          OPENCV_CMAKE_DIR="$(dirname "$CONFIG")"
          OPENCV_NATIVE_DIR="$(dirname "$(dirname "$OPENCV_CMAKE_DIR")")"
          STATIC_DIR="$OPENCV_NATIVE_DIR/staticlibs/arm64-v8a"
          test -s "$STATIC_DIR/libopencv_core.a" || {
            echo "::error::Missing ARM64 OpenCV core library: $STATIC_DIR/libopencv_core.a"
            exit 1
          }
          test -s "$STATIC_DIR/libopencv_imgproc.a"
          test -s "$STATIC_DIR/libopencv_objdetect.a"
          test -s "$STATIC_DIR/libopencv_video.a"
          test -s "$STATIC_DIR/libopencv_features2d.a"
          echo "opencv_dir=$OPENCV_CMAKE_DIR" >> "$GITHUB_OUTPUT"
          echo "OpenCV Android CMake package (ABI arm64-v8a): $OPENCV_CMAKE_DIR"

      - name: Build APK (generated files stay in runner temp)
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
          OPENCV_DIR: ${{ steps.opencv.outputs.opencv_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "$SRC_DIR" \
            -PopencvDir="$OPENCV_DIR" \
            :app:assembleRelease
          mkdir -p "$RUNNER_TEMP/diplomka-output"
          APK="$SRC_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { find "$SRC_DIR/app/build/outputs" -maxdepth 6 -type f -print; exit 1; }
          cp "$APK" "$RUNNER_TEMP/diplomka-output/Diplomka-Android-2.7.5-arm64-v8a.apk"
          sha256sum "$RUNNER_TEMP/diplomka-output/Diplomka-Android-2.7.5-arm64-v8a.apk"
          ls -lh "$RUNNER_TEMP/diplomka-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diplomka-Android-APK-2.7.5
          path: ${{ runner.temp }}/diplomka-output/Diplomka-Android-2.7.5-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
