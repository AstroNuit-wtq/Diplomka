name: Build Diplomka Native C++ APK · 2.5.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'Diplomka_Native_CPP_Source.zip'
      - '.github/workflows/build-astro-cpp.yml'

# Repository cleanup commits deletions, so write permission is required.
permissions:
  contents: write

concurrency:
  group: diplomka-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android arm64-v8a release APK · 2.5.1
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not request the obsolete "tools" SDK package. Command-line tools
      # are installed by setup-android itself; only platform-tools is needed here.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;30.0.16248370' \
            'cmake;3.22.1'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Source archive and all generated build files stay outside the checkout.
      - name: Extract native source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/Diplomka_Native_CPP_Source.zip"
          test -f "$ARCHIVE" || { echo 'Missing Diplomka_Native_CPP_Source.zip in repository root'; exit 1; }
          SRC_PARENT="$RUNNER_TEMP/diplomka-src"
          mkdir -p "$SRC_PARENT"
          unzip -q "$ARCHIVE" -d "$SRC_PARENT"
          if [ -f "$SRC_PARENT/settings.gradle" ]; then
            SRC_DIR="$SRC_PARENT"
          else
            SRC_DIR="$(find "$SRC_PARENT" -mindepth 2 -maxdepth 4 -name settings.gradle -print -quit | xargs -r dirname)"
          fi
          test -n "$SRC_DIR" && test -f "$SRC_DIR/app/src/main/cpp/CMakeLists.txt"
          echo "src_dir=$SRC_DIR" >> "$GITHUB_OUTPUT"
          echo "Source extracted to runner temp directory: $SRC_DIR"

      - name: Verify C++ UI constants and Android looper API
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
        run: |
          set -euo pipefail
          if grep -RIn --include='*.cpp' --include='*.h' 'IM_PI' \
            "$SRC_DIR/app/src/main/cpp" "$SRC_DIR/raspberry_pi"; then
            echo '::error::Undeclared IM_PI macro remains in source. Use the project-owned kPi constant.'
            exit 1
          fi
          if grep -RIn --include='*.cpp' --include='*.h' 'ALooper_pollAll' \
            "$SRC_DIR/app/src/main/cpp"; then
            echo '::error::Obsolete ALooper_pollAll API remains in Android source.'
            exit 1
          fi
          grep -q 'constexpr float kPi' "$SRC_DIR/app/src/main/cpp/main.cpp"
          grep -q 'constexpr float kPi' "$SRC_DIR/raspberry_pi/main.cpp"

      - name: Run portable C++ unit tests
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Werror \
            "$SRC_DIR/tests/heading_filter_test.cpp" \
            -o "$RUNNER_TEMP/diplomka-heading-test"
          "$RUNNER_TEMP/diplomka-heading-test"

      - name: Download NCNN Android CPU runtime
        id: ncnn
        shell: bash
        run: |
          set -euo pipefail
          DEP="$RUNNER_TEMP/diplomka-deps/ncnn"
          mkdir -p "$DEP"
          curl --fail --location --retry 4 \
            'https://github.com/Tencent/ncnn/releases/download/20261020/ncnn-20261020-android.zip' \
            -o "$RUNNER_TEMP/ncnn-android.zip"
          echo '62a9edb493ceb42a5c9cbf2d3a79b3f44bff06c625134ffb64d183dcc42c25fc  ncnn-android.zip' > "$RUNNER_TEMP/ncnn.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check ncnn.sha256)
          unzip -q "$RUNNER_TEMP/ncnn-android.zip" -d "$DEP"
          CONFIG="$(find "$DEP" -name ncnnConfig.cmake -print -quit)"
          test -n "$CONFIG" || { echo 'ncnnConfig.cmake was not found in NCNN archive'; find "$DEP" -maxdepth 5 -type f | head -80; exit 1; }
          NCNN_CMAKE_DIR="$(dirname "$CONFIG")"
          echo "ncnn_dir=$NCNN_CMAKE_DIR" >> "$GITHUB_OUTPUT"
          echo "NCNN CMake package: $NCNN_CMAKE_DIR"

      - name: Download pretrained NCNN models
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
        run: |
          set -euo pipefail
          ASSETS="$SRC_DIR/app/src/main/assets"
          mkdir -p "$ASSETS"
          BASE='https://raw.githubusercontent.com/nihui/ncnn-android-yolov8/20260527.f1ac75e/app/src/main/assets'
          curl --fail --location --retry 4 "$BASE/yolov8n.ncnn.param" -o "$ASSETS/yolov8n.ncnn.param"
          curl --fail --location --retry 4 "$BASE/yolov8n.ncnn.bin" -o "$ASSETS/yolov8n.ncnn.bin"
          curl --fail --location --retry 4 "$BASE/yolov8n_pose.ncnn.param" -o "$ASSETS/yolov8n_pose.ncnn.param"
          curl --fail --location --retry 4 "$BASE/yolov8n_pose.ncnn.bin" -o "$ASSETS/yolov8n_pose.ncnn.bin"
          test "$(wc -c < "$ASSETS/yolov8n.ncnn.param")" -gt 1000
          test "$(wc -c < "$ASSETS/yolov8n.ncnn.bin")" -gt 100000
          test "$(wc -c < "$ASSETS/yolov8n_pose.ncnn.param")" -gt 1000
          test "$(wc -c < "$ASSETS/yolov8n_pose.ncnn.bin")" -gt 100000
          sha256sum "$ASSETS"/*

      - name: Build APK (generated files stay in runner temp)
        shell: bash
        env:
          SRC_DIR: ${{ steps.source.outputs.src_dir }}
          NCNN_DIR: ${{ steps.ncnn.outputs.ncnn_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PncnnDir="$NCNN_DIR" \
            -p "$SRC_DIR" \
            :app:assembleRelease
          mkdir -p "$RUNNER_TEMP/diplomka-output"
          APK="$SRC_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { find "$SRC_DIR/app/build/outputs" -maxdepth 6 -type f -print; exit 1; }
          cp "$APK" "$RUNNER_TEMP/diplomka-output/Diplomka-Native-C++-arm64-v8a.apk"
          sha256sum "$RUNNER_TEMP/diplomka-output/Diplomka-Native-C++-arm64-v8a.apk"
          ls -lh "$RUNNER_TEMP/diplomka-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diplomka-Native-Cpp-APK-2.5.1
          path: ${{ runner.temp }}/diplomka-output/Diplomka-Native-C++-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      # Runs after success or failure. This intentionally deletes every tracked
      # and untracked repository item except .github/workflows, then pushes the
      # cleanup commit. The input ZIP must be uploaded again for the next build.
      - name: Clean repository (keep only .github/workflows)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          if [[ ! -d "$GITHUB_WORKSPACE/.git" ]]; then
            echo '::warning::Checkout did not complete; repository cleanup cannot run.'
            exit 0
          fi

          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::Cleanup requires a branch ref; current ref is $GITHUB_REF"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep Git metadata and the GitHub Actions workflow directory only.
          while IFS= read -r -d '' item; do
            name="${item#./}"
            case "$name" in
              .git|.github) ;;
              *) rm -rf -- "$item" ;;
            esac
          done < <(find . -mindepth 1 -maxdepth 1 -print0)

          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf -- {} +

          git add --all
          if git diff --cached --quiet; then
            echo 'Repository already contains only .github/workflows; no cleanup commit needed.'
          else
            git commit -m 'chore: clean repository after Diplomka build [skip ci]'
            git push origin "HEAD:${GITHUB_REF}"
            echo 'Repository cleaned. Only .github/workflows remains.'
          fi
